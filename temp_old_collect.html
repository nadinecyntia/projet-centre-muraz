<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Collecte de donn├®es</title>
	<link href="/css/style.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		:root { --muraz: #0ea5e9; --muraz-dark:#0369a1; }
		body { font-family: Inter, system-ui, -apple-system, Arial, sans-serif; }
		.container { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }
		.header { display:flex; align-items:center; justify-content:space-between; margin: 1rem 0 1.25rem; }
		.h-title { font-size:1.5rem; font-weight:700; color:#111827; }
		.card { background:#fff; border:1px solid #e5e7eb; border-radius: 14px; box-shadow:0 6px 18px rgba(0,0,0,.05); }
		.nav { position: sticky; top:0; z-index: 10; background:#fff; border-bottom:1px solid #e5e7eb; }
		.tabs { display:flex; gap:.5rem; padding:.75rem; }
		.tab { padding:.6rem 1rem; border-radius:.6rem; border:1px solid #e5e7eb; background:#fff; cursor:pointer; display:flex; align-items:center; gap:.5rem; }
		.tab.active { background: var(--muraz); border-color: var(--muraz); color:#fff; }
		.form-wrap { padding: 1.25rem; }
		.grid { display:grid; grid-template-columns: repeat(12, 1fr); gap: .9rem; }
		.col-12{ grid-column: span 12; }
		.col-6{ grid-column: span 6; }
		.col-4{ grid-column: span 4; }
		.col-3{ grid-column: span 3; }
		@media (max-width: 900px){ .col-6,.col-4,.col-3{ grid-column: span 12; } }
		.label { display:block; font-weight:600; color:#111827; margin-bottom:.35rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco; }
		.help { color:#6b7280; font-size:.85rem; margin-top:.25rem; }
		.input, .select, .textarea { width:100%; padding:.65rem .8rem; border:1px solid #e5e7eb; border-radius:.6rem; background:#fff; }
		.textarea { min-height: 90px; }
		.actions { display:flex; gap:.75rem; flex-wrap:wrap; }
		.btn { display:inline-flex; align-items:center; gap:.5rem; padding:.65rem 1rem; border-radius:.6rem; border:1px solid #e5e7eb; background:#fff; cursor:pointer; }
		.btn-primary { background: var(--muraz); border-color: var(--muraz); color:#fff; }
		.btn-primary:hover { background: var(--muraz-dark); border-color: var(--muraz-dark); }
		hr.sep{ border:none; border-top:1px solid #e5e7eb; margin:1.2rem 0; }
	</style>
</head>
<body class="bg-gray-50">

	<script>
	(function(){
		const tabs = document.querySelectorAll('.tab');
		tabs.forEach(t => t.addEventListener('click', () => {
			tabs.forEach(x=>x.classList.remove('active'));
			document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
			t.classList.add('active');
			document.querySelector(t.getAttribute('data-target')).style.display = '';
		}));

		document.querySelectorAll('[data-gps]').forEach(btn => {
			btn.addEventListener('click', async () => {
				const field = document.querySelector(`input[name="${btn.dataset.gps}"]`);
				if (!navigator.geolocation) { alert('G├®olocalisation non support├®e'); return; }
				navigator.geolocation.getCurrentPosition(pos => {
					field.value = `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
				}, err => alert('Localisation refus├®e'));
			});
		});

		// Rendre tous les champs obligatoires
		document.querySelectorAll('input, select, textarea').forEach(el => { el.required = true; });
		// Ajouter une ├®toile rouge aux labels correspondants
		document.querySelectorAll('input[required], select[required], textarea[required]').forEach(el => {
			let label = el.previousElementSibling;
			if (label && label.classList.contains('label') && !label.querySelector('.req-star')) {
				const star = document.createElement('span');
				star.className = 'req-star';
				star.textContent = ' *';
				star.style.color = '#ef4444';
				label.appendChild(star);
			}
		});
		// Clamp automatique des champs number avec min=0
		document.querySelectorAll('input[type="number"][min="0"]').forEach(el => {
			el.addEventListener('input', () => {
				if (el.value === '') return;
				const n = Number(el.value);
				if (Number.isNaN(n) || n < 0) el.value = 0;
			});
		});
		// Forcer min=0 et step=1 sur tous les champs num├®riques
		document.querySelectorAll('input[type="number"]').forEach(el => {
			if (!el.hasAttribute('min')) el.setAttribute('min','0');
			if (!el.hasAttribute('step')) el.setAttribute('step','1');
		});

		function formToObject(section) {
			const obj = {};
			section.querySelectorAll('input, select, textarea').forEach(el => {
				const name = el.name; if (!name) return;
				if (el.tagName === 'SELECT' && el.multiple) obj[name] = Array.from(el.selectedOptions).map(o => o.value);
				else if (name.endsWith('_sector')) obj[name] = el.value ? [el.value] : [];
				else obj[name] = el.value;
			});
			return obj;
		}

		async function postJSON(url, data) {
			const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(data) });
			if (!res.ok) throw new Error(await res.text());
			return res.json();
		}

		function resetSection(section) {
			section.querySelectorAll('input, select, textarea').forEach(el => {
				if (el.tagName === 'SELECT') {
					if (el.multiple) Array.from(el.options).forEach(o => o.selected = false);
					else el.selectedIndex = 0;
				} else if (el.type === 'number' || el.type === 'text' || el.type === 'time' || el.type === 'date') {
					el.value = '';
				} else if (el.tagName === 'TEXTAREA') {
					el.value = '';
				}
			});
		}

		document.getElementById('submit-eggs').addEventListener('click', async () => {
			const section = document.getElementById('eggs'); const status = document.getElementById('status-eggs');
			status.textContent = 'Envoi...';
			try { const payload = formToObject(section); await postJSON('/api/collect/eggs', payload); status.textContent = 'Ô£à Enregistr├®'; resetSection(section); }
			catch (e) { status.textContent = 'ÔØî ' + e.message; }
		});

		document.getElementById('submit-breeding').addEventListener('click', async () => {
			const section = document.getElementById('breeding'); const status = document.getElementById('status-breeding');
			status.textContent = 'Envoi...';
			try { const payload = formToObject(section); await postJSON('/api/collect/breeding', payload); status.textContent = 'Ô£à Enregistr├®'; resetSection(section); }
			catch (e) { status.textContent = 'ÔØî ' + e.message; }
		});

		document.getElementById('submit-mosquitoes').addEventListener('click', async () => {
			const section = document.getElementById('mosquitoes'); const status = document.getElementById('status-mosquitoes');
			status.textContent = 'Envoi...';
			try { const payload = formToObject(section); await postJSON('/api/collect/mosquitoes', payload); status.textContent = 'Ô£à Enregistr├®'; resetSection(section); }
			catch (e) { status.textContent = 'ÔØî ' + e.message; }
		});
	})();
	</script>
