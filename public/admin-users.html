<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background:#f8fafc; }
        .card{ background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04); }
        .btn{ border-radius:8px;padding:10px 16px;font-weight:600 }
        .btn-primary{ background:#1e40af;color:#fff }
        .btn-danger{ background:#dc2626;color:#fff }
        .input{ width:100%;height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;background:#fff }
        .input::-ms-reveal{ display:none }
        select.input{ padding-right:36px }
        .input:focus{ outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.15) }
        .form-compact{ max-width:520px;margin:0 auto }
        .label{ display:block;font-size:13px;font-weight:600;color:#374151;margin:4px 0 6px }
        .modal-overlay{ position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:16px }
        .modal-overlay.flex{ display:flex }
        .modal-header{ display:flex;align-items:center;justify-content:space-between;margin-bottom:12px }
        .modal-title{ font-size:18px;font-weight:700;color:#111827 }
        .modal-actions{ display:flex;gap:8px;padding-top:8px }
        table{ width:100%;border-collapse:collapse }
        th,td{ padding:12px 14px;border-bottom:1px solid #e5e7eb;text-align:left; }
        th{ background:#f3f4f6;font-weight:700;color:#374151 }
        .badge{ font-size:12px;padding:4px 8px;border-radius:6px;background:#eef2ff;color:#4338ca }
    </style>
    <script defer src="/js/app.js"></script>
</head>
<body class="min-h-screen">
    <nav id="main-nav" class="p-4 bg-white border-b"></nav>

    <main class="max-w-5xl mx-auto p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Gestion des Utilisateurs</h1>

        <section class="card p-4 mb-6">
            <h2 class="text-lg font-semibold mb-3">Créer un utilisateur</h2>
            <form id="createForm" class="space-y-4 form-compact">
                <div>
                    <label class="label">Nom d'utilisateur</label>
                    <input class="input" required name="username" placeholder="Nom d'utilisateur">
                </div>
                <div>
                    <label class="label">Email</label>
                    <input class="input" required type="email" name="email" placeholder="Email">
                </div>
                <div>
                    <label class="label">Mot de passe</label>
                    <input class="input" required type="password" name="password" placeholder="Mot de passe">
                </div>
                <div>
                    <label class="label">Rôle</label>
                    <select class="input" required name="role">
                        <option value="VIEWER">VIEWER</option>
                        <option value="INVESTIGATOR">INVESTIGATOR</option>
                        <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                    </select>
                </div>
                <div>
                    <button class="btn btn-primary w-full" style="height:42px" type="submit"><i class="fa fa-plus mr-2"></i>Créer</button>
                </div>
            </form>
        </section>

        <section class="card p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold">Utilisateurs</h2>
                <button id="refreshBtn" class="btn">Rafraîchir</button>
            </div>
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modale Édition Utilisateur -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="card p-5 w-full form-compact" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">Modifier l'utilisateur</h3>
                <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700"><i class="fa fa-times"></i></button>
            </div>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="edit_id">
                <div>
                    <label class="label">Nom d'utilisateur</label>
                    <input id="edit_username" class="input" required placeholder="Nom d'utilisateur">
                </div>
                <div>
                    <label class="label">Email</label>
                    <input id="edit_email" class="input" required type="email" placeholder="Email">
                </div>
                <div>
                    <label class="label">Rôle</label>
                    <select id="edit_role" class="input" required>
                        <option value="VIEWER">VIEWER</option>
                        <option value="INVESTIGATOR">INVESTIGATOR</option>
                        <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                    </select>
                </div>
                <div>
                    <label class="label">Nouveau mot de passe (optionnel)</label>
                    <input id="edit_password" class="input" type="password" placeholder="Laisser vide pour conserver">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeEditModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" style="margin-left:auto">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Confirmation Suppression -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="card p-5 w-full form-compact" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">Supprimer l'utilisateur</h3>
                <button onclick="closeDeleteModal()" class="text-gray-500 hover:text-gray-700"><i class="fa fa-times"></i></button>
            </div>
            <p class="text-gray-700 mb-4">Voulez-vous vraiment supprimer <span id="delete_user_label" class="font-semibold"></span> ?</p>
            <div class="modal-actions">
                <button class="btn" onclick="closeDeleteModal()">Annuler</button>
                <button class="btn btn-danger" style="margin-left:auto" onclick="confirmDeleteUser()">Supprimer</button>
            </div>
        </div>
    </div>

    <script>
    // État modales
    let currentDeleteId = null;

    async function fetchUsers(){
        const r = await fetch('/api/users', { credentials: 'same-origin' });
        const j = await r.json();
        if(!j.success) throw new Error(j.message||'Erreur');
        return j.data;
    }
    function row(u){
        return `
        <tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge">${u.role}</span></td>
            <td class="space-x-2">
                <button class="btn" onclick="editUser(${u.id}, '${u.username}', '${u.email}', '${u.role}')">Éditer</button>
                <button class="btn btn-danger" onclick="deleteUser(${u.id})">Supprimer</button>
            </td>
        </tr>`;
    }
    async function render(){
        const body = document.getElementById('usersBody');
        body.innerHTML = '<tr><td colspan="5">Chargement...</td></tr>';
        try{ const data = await fetchUsers(); body.innerHTML = data.map(row).join(''); }
        catch(e){ body.innerHTML = '<tr><td colspan="5">Erreur de chargement</td></tr>'; }
    }
    document.getElementById('refreshBtn').addEventListener('click', render);
    document.getElementById('createForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());
        const r = await fetch('/api/users', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify(payload)});
        const j = await r.json();
        if(j.success){ e.target.reset(); render(); }
        else{ alert((j.message||'Erreur création') + (j.error? ('\nDétail: '+j.error):'')); }
    });
    // Ouvrir modale d'édition
    function editUser(id, username, email, role){
        document.getElementById('edit_id').value = id;
        document.getElementById('edit_username').value = username;
        document.getElementById('edit_email').value = email;
        document.getElementById('edit_role').value = role;
        document.getElementById('edit_password').value = '';
        const m = document.getElementById('editModal');
        m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeEditModal(){
        const m = document.getElementById('editModal');
        m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.getElementById('editForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const id = document.getElementById('edit_id').value;
        const payload = {
            username: document.getElementById('edit_username').value.trim(),
            email: document.getElementById('edit_email').value.trim(),
            role: document.getElementById('edit_role').value,
        };
        const pwd = document.getElementById('edit_password').value;
        if (pwd) payload.password = pwd;
        const r = await fetch('/api/users/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify(payload)});
        const j = await r.json();
        if (j.success){ closeEditModal(); render(); }
        else { alert(j.message||'Erreur mise à jour'); }
    });

    // Modale suppression
    function deleteUser(id, username){
        currentDeleteId = id;
        document.getElementById('delete_user_label').textContent = username;
        const m = document.getElementById('deleteModal');
        m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeDeleteModal(){
        const m = document.getElementById('deleteModal');
        m.classList.add('hidden'); m.classList.remove('flex');
        currentDeleteId = null;
    }
    async function confirmDeleteUser(){
        if(!currentDeleteId) return;
        const r = await fetch('/api/users/'+currentDeleteId, { method:'DELETE', credentials:'same-origin' });
        const j = await r.json();
        if (j.success){ closeDeleteModal(); render(); }
        else { alert(j.message||'Erreur suppression'); }
    }
    window.editUser = editUser; window.deleteUser = deleteUser; window.closeEditModal = closeEditModal; window.closeDeleteModal = closeDeleteModal; window.confirmDeleteUser = confirmDeleteUser;
    render();
    </script>
</body>
</html>
